name: Release assinada aprovada
on:
  workflow_dispatch:
    inputs:
      physical_tested:
        description: 'Confirmo validação física e aprovação desta versão conforme docs/TESTING.md'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  signed-release:
    if: inputs.physical_tested && github.ref == 'refs/heads/main'
    environment: release-production
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Exigir CI aprovada para este commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          gh run list --repo "$REPO" --workflow android.yml --commit "$COMMIT" --status success --json databaseId --jq 'length > 0' | grep -qx true
      - name: Restaurar chave fora do repositório
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Testar e compilar versão assinada
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :core:test :app:lintRelease :app:assembleRelease
      - name: Exigir versão estável e verificar assinatura
        run: |
          ! grep -Eq 'versionName = ".*(test|debug|alpha|beta)' app/build.gradle.kts
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Preparar checksum
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Poco-Optimizer-release.apk
          cd dist
          sha256sum Poco-Optimizer-release.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release
          path: dist/
          if-no-files-found: error
      - name: Publicar versão aprovada
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: gh release create "release-$RUN_ID" dist/* --repo "$REPO" --target "$COMMIT" --title "Poco Optimizer — versão aprovada" --notes "Versão assinada, com aprovação de validação física declarada pelo responsável. Consulte os relatórios da execução e o plano de testes."
      - name: Remover chave temporária
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
