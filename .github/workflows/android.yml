name: Android APK
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
    tags: ['test-*']
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:
    inputs:
      publish_test:
        description: 'Publicar APK validado como pré-release de teste'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Instalar SDK estável
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Testes, lint e APK de teste
        run: ./gradlew --no-daemon :core:test :app:lintDebug :app:assembleDebug :app:lintValidation :app:assembleValidation :app:assembleValidationAndroidTest
      - name: Auditar APK distribuído e alinhamento de 16 KiB
        run: python3 scripts/verify_distribution.py app/build/outputs/apk/debug/app-debug.apk
      - name: Preparar download e checksum
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Poco-Optimizer-0.1.1-test.apk
          cd dist
          sha256sum Poco-Optimizer-0.1.1-test.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-apk-not-validated
          path: dist/
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            core/build/reports/tests/
            app/build/reports/lint-results-*.html
  device-test:
    name: device-test (API ${{ matrix.api-level }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        api-level: [35, 36]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: candidate-apk-not-validated
          path: dist
      - name: Verificar checksum do APK a instalar
        run: cd dist && sha256sum -c SHA256SUMS.txt
      - name: Habilitar KVM do runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/device_checks.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            diagnostics/
            screenshots/
  validated-apk:
    needs: [build, device-test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: candidate-apk-not-validated
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: Poco-Optimizer-test-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30
  publish-test:
    if: startsWith(github.ref, 'refs/tags/test-') || (github.event_name == 'workflow_dispatch' && inputs.publish_test)
    needs: [validated-apk]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Poco-Optimizer-test-apk
          path: dist
      - name: Publicar somente como pré-release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh release create "test-$RUN_ID" dist/* --repo "$REPO" --target "$COMMIT" --prerelease --title "Poco Optimizer 0.1.1 — teste" --notes "APK debug de teste. Testes unitários, lint, abertura e navegação do APK distribuído e testes instrumentados passaram no Android 15/API 35 e Android 16/API 36 nesta execução. Ainda exige validação física no Poco X6 5G/HyperOS. Não é versão estável. Consulte README e docs/TESTING.md."
