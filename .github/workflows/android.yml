name: Android APK
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
    tags: ['test-*']
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:
    inputs:
      publish_test:
        description: 'Publicar APK validado como pré-release de teste'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Instalar SDK estável
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Testes, lint e APK de teste
        run: ./gradlew --no-daemon :core:test :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Preparar download e checksum
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Poco-Optimizer-0.1.0-test.apk
          cd dist
          sha256sum Poco-Optimizer-0.1.0-test.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Poco-Optimizer-test-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            core/build/reports/tests/
            app/build/reports/lint-results-debug.html
  device-test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Habilitar KVM do runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
            mkdir -p screenshots
            adb exec-out run-as br.com.pocooptimizer.test cat files/screenshots/dashboard.png > screenshots/dashboard.png
            adb exec-out run-as br.com.pocooptimizer.test cat files/screenshots/cleaner.png > screenshots/cleaner.png
            adb exec-out run-as br.com.pocooptimizer.test cat files/screenshots/security.png > screenshots/security.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports
          path: |
            app/build/reports/androidTests/
            screenshots/
  publish-test:
    if: startsWith(github.ref, 'refs/tags/test-') || (github.event_name == 'workflow_dispatch' && inputs.publish_test)
    needs: [build, device-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Poco-Optimizer-test-apk
          path: dist
      - name: Publicar somente como pré-release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh release create "test-$RUN_ID" dist/* --repo "$REPO" --target "$COMMIT" --prerelease --title "Poco Optimizer 0.1.0 — teste" --notes "APK debug de teste. Testes unitários, lint e testes instrumentados passaram nesta execução. Ainda exige validação física no Poco X6 5G/HyperOS. Não é versão estável. Consulte README e docs/TESTING.md."
